name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem_dev_password
          POSTGRES_DB: siem
        options: >-
          --health-cmd "pg_isready -U siem -d siem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_URL: http://localhost:3000
      LOG_FILE_PATH: logs/application.log
      BATCH_SIZE: 100
      FLUSH_INTERVAL_MS: 1000
      MAX_RETRIES: 5

      PORT: 3000

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: siem
      DB_PASSWORD: siem_dev_password
      DB_NAME: siem

      API_KEY: ci-test-api-key

      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: |
          PGPASSWORD=siem_dev_password psql \
            -h localhost \
            -U siem \
            -d siem \
            -f db/init.sql

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build