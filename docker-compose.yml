services:
  postgres:
    image: postgres:17
    container_name: siem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem_dev_password
      POSTGRES_DB: siem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: